name: Hosted rehearsal readiness (opt-in)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/hosted-smoke.yml
      - .github/workflows/portable-image.yml
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Galinsky Arts free Render service. Repository variables override these
    # public, non-secret defaults. Media checks default off until private S3
    # storage is configured; set OUR_JAM_REQUIRE_MEDIA(_VERIFIED)=1 then.
    env:
      OUR_JAM_HOSTED_URL: ${{ vars.OUR_JAM_HOSTED_URL || 'https://our-jam-fntx.onrender.com' }}
      OUR_JAM_REQUIRE_MEDIA: ${{ vars.OUR_JAM_REQUIRE_MEDIA || '0' }}
      OUR_JAM_REQUIRE_MEDIA_VERIFIED: ${{ vars.OUR_JAM_REQUIRE_MEDIA_VERIFIED || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact URL and hosted authorization/readiness
        run: |
          node --input-type=module -e 'const u=new URL(process.env.OUR_JAM_HOSTED_URL);if(u.protocol!=="https:"||u.username||u.password||u.pathname!=="/"||u.search||u.hash)process.exit(1)'
          node scripts/check-hosted-readiness.mjs "$OUR_JAM_HOSTED_URL"
          echo "Hosted readiness checked at $OUR_JAM_HOSTED_URL (media required: $OUR_JAM_REQUIRE_MEDIA, verified required: $OUR_JAM_REQUIRE_MEDIA_VERIFIED)" >> "$GITHUB_STEP_SUMMARY"
