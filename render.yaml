# Galinsky Arts free Render web service (workspace tea-dbp1vrrl550s73c3dgrg).
# Secrets (DATABASE_URL, DATABASE_URL_UNPOOLED, OPERATOR_TOKEN, ADMIN_TOKEN) live
# only in Render's environment settings, never in this file.
services:
  - type: web
    name: our-jam
    runtime: docker
    repo: https://github.com/Galinsky-Arts/Our-Jam
    branch: main
    region: virginia
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_ORIGIN
        sync: false
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: OPERATOR_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GENERATION_ENABLED
        value: "0"
      - key: RUN_INLINE_GENERATION
        value: "0"
      - key: RUN_MIGRATIONS
        value: "0"
      - key: EMAIL_ENABLED
        value: "0"
